<VirtualHost *:80>
    ServerName staff.lab.local
    DocumentRoot /var/www/staff

    <Directory /var/www/staff>
        AllowOverride All
        Require all granted
        Options -Indexes

        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ index.php [QSA,L]
    </Directory>

    # VULN: Không có CSP header — cho phép stored XSS trong ticket_view chạy tự do
    # VULN: Không có X-Frame-Options

    ErrorLog  /var/log/apache2/staff-error.log
    CustomLog /var/log/apache2/staff-access.log combined
</VirtualHost>
Listen 8888
<VirtualHost *:8888>
    DocumentRoot /var/www/uploads/internal
    DirectoryIndex index.php

    # Serve /uploads/ path — listing các file đã upload
    Alias /uploads /var/www/uploads/internal

    <Directory /var/www/uploads/internal>
        Require all granted
        Options +Indexes
        AllowOverride None
        AddHandler application/x-httpd-php .php
    </Directory>

    ErrorLog  /var/log/apache2/staff-internal-error.log
    CustomLog /var/log/apache2/staff-internal-access.log combined
</VirtualHost>
