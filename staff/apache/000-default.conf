<VirtualHost *:80>
    ServerName staff.lab.local
    DocumentRoot /var/www/staff

    <Directory /var/www/staff>
        AllowOverride All
        Require all granted
        Options -Indexes

        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ index.php [QSA,L]
    </Directory>

    # VULN: Không có CSP header — cho phép stored XSS trong ticket_view chạy tự do
    # VULN: Không có X-Frame-Options

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
