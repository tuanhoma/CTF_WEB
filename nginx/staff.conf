server {
    listen 80;
    server_name staff.lab.local;

    access_log /var/log/nginx/staff_access.log detailed;
    error_log  /var/log/nginx/staff_error.log;

    # VULN: Không có CSP header — cho phép stored XSS trong ticket_view chạy tự do
    # VULN: Không có X-Frame-Options

    location / {
        proxy_pass         http://waf-proxy:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 30;
    }
}
