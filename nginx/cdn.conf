server {
    listen 80;
    server_name cdn.lab.local;

    access_log /var/log/nginx/cdn_access.log detailed;
    error_log  /var/log/nginx/cdn_error.log;

    # Nginx đóng vai trò Reverse Proxy thuần túy cho CDN domain.
    # Toàn bộ logic PHP (thực thi, auth) được xử lý bởi Apache mod_php
    # trong container internal-api, cụ thể là:
    #
    #   VULN 1 — Double Extension: Apache dùng AddHandler (không phải SetHandler)
    #   nên bất kỳ file nào có ".php" trong tên (vd: shell.php.jpg) đều bị
    #   thực thi như PHP. Tương đương regex "~ \.php" (không có $) của Nginx cũ.
    #
    #   VULN 2 — Internal Auth Bypass: Apache tự động prepend auth.php cho mọi
    #   request vào /uploads/internal/ thông qua php_value auto_prepend_file.
    #   Nếu không có session role=staff/admin -> 403 Forbidden.

    location / {
        proxy_pass         http://internal-api:80;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 10;
    }
}
