# Cho phép truy cập bằng IP (không qua domain) — bypass WAF
# Khi user truy cập http://192.168.137.1 sẽ được proxy thẳng tới portal
# Không đi qua BunkerWeb → tránh lỗi "NOTHING TO SEE HERE"

server {
    listen 80;
    server_name 192.168.137.1;

    access_log /var/log/nginx/ip_access.log detailed;
    error_log  /var/log/nginx/ip_error.log;

    # Mặc định: truy cập IP → vào portal
    # QUAN TRỌNG: Truyền $host thật (192.168.137.1) để auth.php KHÔNG set
    # cookie domain = .lab.local → browser chấp nhận cookie
    location / {
        proxy_pass         http://portal:80;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 30;
    }

    # /staff/ → proxy tới staff app
    location /staff/ {
        proxy_pass         http://staff:80/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 30;
    }

    # /api/ → proxy tới api app
    location /api/ {
        proxy_pass         http://api:80/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 30;
    }
}
