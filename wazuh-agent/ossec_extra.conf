<ossec_config>
  <!-- CTF_WEB WAF Logs -->
  <localfile>
    <location>/var/ossec/logs/ctf_web_logs/waf/access.log</location>
    <log_format>syslog</log_format>
  </localfile>
  <localfile>
    <location>/var/ossec/logs/ctf_web_logs/waf/error.log</location>
    <log_format>syslog</log_format>
  </localfile>
  <localfile>
    <location>/var/ossec/logs/ctf_web_logs/waf/modsec_audit.log</location>
    <log_format>syslog</log_format>
  </localfile>

  <!-- CTF_WEB Nginx Logs -->
  <localfile>
    <location>/var/ossec/logs/ctf_web_logs/nginx/portal_access.log</location>
    <log_format>syslog</log_format>
  </localfile>
  <localfile>
    <location>/var/ossec/logs/ctf_web_logs/nginx/staff_access.log</location>
    <log_format>syslog</log_format>
  </localfile>
  <localfile>
    <location>/var/ossec/logs/ctf_web_logs/nginx/api_access.log</location>
    <log_format>syslog</log_format>
  </localfile>
  <localfile>
    <location>/var/ossec/logs/ctf_web_logs/nginx/error.log</location>
    <log_format>syslog</log_format>
  </localfile>

  <!-- CTF_WEB Backend Logs -->
  <localfile>
    <location>/var/ossec/logs/ctf_web_logs/backend/api-access.log</location>
    <log_format>syslog</log_format>
  </localfile>
  <localfile>
    <location>/var/ossec/logs/ctf_web_logs/backend/portal-access.log</location>
    <log_format>syslog</log_format>
  </localfile>
  <localfile>
    <location>/var/ossec/logs/ctf_web_logs/backend/staff-access.log</location>
    <log_format>syslog</log_format>
  </localfile>
  <localfile>
    <location>/var/ossec/logs/ctf_web_logs/backend/error.log</location>
    <log_format>syslog</log_format>
  </localfile>
</ossec_config>
