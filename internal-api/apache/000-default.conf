<VirtualHost *:80>
    ServerName internal-api.lab.local
    DocumentRoot /var/www/internal-api

    <Directory /var/www/internal-api>
        AllowOverride All
        Require all granted
        Options -Indexes

        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ index.php [QSA,L]
    </Directory>

    # Alias /uploads trỏ về shared volume — phục vụ cả static lẫn PHP cho CDN
    Alias /uploads /var/www/uploads

    <Directory /var/www/uploads>
        AllowOverride None
        Require all granted
        Options -Indexes

        # VULN: Dùng AddHandler (không phải SetHandler) để bắt bất kỳ file nào
        # có .php ở BẤT KỲ ĐÂU trong tên (vd: shell.php.jpg, shell.php.png).
        # Đây là "Apache Double Extension Vulnerability" — tương đương với
        # regex "~ \.php" (không có $) trong Nginx cũ.
        AddHandler application/x-httpd-php .php
    </Directory>

    # LocationMatch khớp theo URL request path — đảm bảo auth.php được prepend
    # cho MỌI request đến /uploads/internal/ kể cả sau khi RewriteRule nội bộ
    # redirect sang /internal.php (nằm ở /var/www/internal-api/).
    # Nếu dùng <Directory> thì sẽ mất hiệu lực khi file thực tế ở thư mục khác.
    <LocationMatch "^/uploads/internal/">
        # VULN: Tự động chèn auth.php trước MỌI file PHP trong /uploads/internal/
        # Tương đương với FastCGI param PHP_VALUE auto_prepend_file trong Nginx cũ.
        # Nếu session không có role=staff/admin -> 403 Forbidden.
        php_value auto_prepend_file "/var/www/uploads/auth.php"
    </LocationMatch>

    <Directory /var/www/uploads/internal>
        AllowOverride All
        Require all granted
        Options +Indexes

        # Task 5: Tắt PHP execution mặc định trong thư mục upload
        # internal.php & auth.php nằm ở /var/www/uploads/ (cha) — không bị ảnh hưởng
        RemoveHandler .php

        RewriteEngine On

        # Redirect MỌI file (kể cả .php) qua internal.php để auth + serve raw content
        # Bỏ điều kiện !\.php để bắt cả file PHP (trước đây PHP files bị execute trực tiếp)
        RewriteCond %{REQUEST_FILENAME} -f
        RewriteRule ^ /uploads/internal.php [QSA,L]

        # Nếu file không tồn tại -> internal.php xử lý 404
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ /uploads/internal.php [QSA,L]
    </Directory>


    # Internal only — không accessible từ public internet
    # Chỉ reachable qua Docker private-net hoặc SSRF
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

Listen 8888
<VirtualHost *:8888>
    DocumentRoot /var/www/uploads/internal
    DirectoryIndex index.php

    <Directory /var/www/uploads/internal>
        Require all granted
        Options +Indexes
        AllowOverride None

        # Cho phép thực thi PHP trên port 8888 (index.php, upload.php)
        AddHandler application/x-httpd-php .php
    </Directory>
</VirtualHost>
