version: '3.8'

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    depends_on:
      - portal
      - api
      - staff
      - internal-api
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
      - nginx-logs:/var/log/nginx
    networks:
      public-net:
        aliases:
          - portal.lab.local
          - staff.lab.local
          - api.lab.local
          - cdn.lab.local
          - internal-api.lab.local
      private-net:
        aliases:
          - portal.lab.local
          - staff.lab.local
          - api.lab.local
          - cdn.lab.local
          - internal-api.lab.local
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 10s
      timeout: 5s
      retries: 3

  portal:
    build: ./portal
    volumes:
      - ./portal/src:/var/www/portal
      - php-sessions:/tmp/sessions
    networks:
      - public-net
      - private-net
    environment:
      DB_HOST: db
      DB_NAME: corpdb
      DB_USER: appuser
      DB_PASS: SuperSecret123!
    depends_on:
      db:
        condition: service_healthy

  api:
    build: ./api
    volumes:
      - ./api/src:/var/www/api
    networks:
      - public-net
      - private-net
    environment:
      DB_HOST: db
      DB_NAME: corpdb
      DB_USER: appuser
      DB_PASS: SuperSecret123!
    depends_on:
      db:
        condition: service_healthy

  staff:
    build: ./staff
    volumes:
      - ./staff/src:/var/www/staff
      - php-sessions:/tmp/sessions
      - nginx-logs:/var/log/nginx:ro
    networks:
      - public-net
      - private-net
    environment:
      DB_HOST: db
      DB_NAME: corpdb
      DB_USER: appuser
      DB_PASS: SuperSecret123!
    depends_on:
      db:
        condition: service_healthy

  internal-api:
    build: ./internal-api
    volumes:
      - ./internal-api/src:/var/www/internal-api
      - ./uploads:/var/www/uploads
      - ./cdn/auth.php:/var/www/uploads/auth.php:ro
      - ./cdn/internal.php:/var/www/uploads/internal.php:ro
      - php-sessions:/tmp/sessions
    # IMPORTANT: internal-api CHỈ nằm trong private-net — không accessible từ internet
    networks:
      - private-net
    environment:
      DB_HOST: db
      DB_NAME: corpdb
      DB_USER: appuser
      DB_PASS: SuperSecret123!
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: corpdb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: SuperSecret123!
      MYSQL_ROOT_PASSWORD: rootpassword
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - db-data:/var/lib/mysql
    networks:
      - private-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "appuser", "-pSuperSecret123!"]
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  public-net:
    driver: bridge
  private-net:
    driver: bridge

volumes:
  db-data:
  nginx-logs:
  php-sessions:
