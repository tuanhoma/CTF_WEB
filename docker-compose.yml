version: "3.9"

services:
  # ==================== DATABASE ====================
  mysql:
    image: mysql:8.0
    container_name: myapp-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: myapp_db
      MYSQL_USER: devuser
      MYSQL_PASSWORD: devpass123
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: myapp-phpmyadmin
    restart: always
    environment:
      PMA_HOST: mysql
      PMA_USER: devuser
      PMA_PASSWORD: devpass123
    ports:
      - "8080:80"
    depends_on:
      - mysql

  # ==================== WEB SERVICES ====================
  nginx:
    build: ./nginx
    container_name: myapp-nginx
    ports:
      - "80:80"
    volumes:
      - ./portal/public:/var/www/portal/public # ← Quan trọng
      - ./api/public:/var/www/api/public
      - ./internal-api/public:/var/www/internal-api/public
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - portal
      - api
      - internal-api

  portal:
    build: ./portal
    container_name: myapp-portal
    environment:
      MYSQL_HOSTNAME: mysql
      MYSQL_USER: devuser
      MYSQL_PASSWORD: devpass123
    volumes:
      - ./portal:/var/www/portal
    depends_on:
      - mysql

  api:
    image: php:8.2-fpm
    container_name: myapp-api
    volumes:
      - ./api:/var/www/api
    depends_on:
      - mysql

  internal-api:
    image: php:8.2-fpm
    container_name: myapp-internal-api
    volumes:
      - ./internal-api:/var/www/internal-api
    depends_on:
      - mysql

volumes:
  mysql-data:
