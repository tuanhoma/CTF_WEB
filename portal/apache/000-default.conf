<VirtualHost *:80>
    ServerName portal.lab.local
    DocumentRoot /var/www/portal

    <Directory /var/www/portal>
        AllowOverride All
        Require all granted
        Options -Indexes

        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ index.php [QSA,L]
    </Directory>

    # VULN: Không có CSP header (có chủ ý — cho phép XSS chạy tự do)
    # VULN: Không có X-Frame-Options (có chủ ý)

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
